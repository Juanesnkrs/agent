            var isIpadLikeDesktop = isTouchDevice && ua.indexOf('macintosh') !== -1;
            var isIos = isIpadLikeDesktop ||

            var styleSheet = document.styleSheets[i];

                bundleStyleSheet = styleSheet;
                break;
            }
        }

        if (!bundleStyleSheet) {
            return;
        }

        var variables = [];
        var varNameRe = /--[\w\d-]+?(?=\:)/g;
        [].slice.call(bundleStyleSheet.cssRules).forEach(function(rule) {
            if (rule.selectorText !== ':root') {

            }

            var match = rule.cssText.match(varNameRe);

            if (match) {
                match.forEach(function(varName) {
                    variables.push(varName);
                });
            }
        });

        variables.forEach(function(propName) {
            var value = root.getPropertyValue(propName);

                newRoot += propName + ': ' +
                    value.replace('url(', 'url(/' + Playtech.Variables.themeName + '/js/app-out/') + ';\n';

  function (WithdrawMethodModel, _, server, config) {
    WithdrawMethodModel.prototype.withdraw = function (data) {
      var request = {
        ID: 33017,
        responses: [33057, 33018, 33019],
        description: 'Withdraw',
        amount: data.amount,
        methodCode: this.get('code'),
      };
      var action = 'withdraw';
      var modelConfig = this.get('config');

      var existingAccount = _.findWhere(this.get('account'), {
        code: data.storedAccountId,
      });

      var existingAccountFields =
        (existingAccount &&
          existingAccount.accountFields &&
          existingAccount.accountFields.field) ||
        null;
      var accountFields =
        (this.get('accountFields') && this.get('accountFields').field) || [];
      var isBancolombia = this.get('code') === 'CoPayoutsViaSC';
      var isNequi = this.get('code') === 'NeqPayoutsViaNV';
      var isBreBWDviaNV = this.get('code') === 'BreBWDviaNV';
      request.successUrl = this.getBackUrl(action, 'success');
      request.errorUrl = this.getBackUrl(action, 'error');
      request.cancelUrl = this.getBackUrl(action, 'cancel');
      request.waitingUrl = this.getBackUrl(action, 'waiting');

      if (!this.get('isGeneric') && !isBancolombia && !isNequi && !isBreBWDviaNV) {
        request.accountCode = this.get('config').creditCard
          ? data.accountCode
          : data.accountId;
      } else if (modelConfig && modelConfig.accountFieldsMap) {
        // account has hardcore `accountFieldsMap`
        var fields = this._makeSimilarDataStructure(
          modelConfig.accountFieldsMap,
        );

        request.specificParams = this.specParamsFormation(data, fields);
      } else if (existingAccountFields) {
        // account received in 33012
        request.specificParams = this.specParamsFormation(
          data,
          existingAccountFields,
        );
      } else if (accountFields) {
        // new account
        request.specificParams = this.specParamsFormation(data, accountFields);
      }

      var isEasyEFTPayouts = this.get('code') === 'EasyEFTPayouts';

      if (isEasyEFTPayouts && !existingAccountFields) {
        request.specificParams = _.pick(data, 'field1', 'field2');
      }

      _.extend(request, _.pick(data, this.confirmedFields));

      if (config.get('cashierClientType')) {
        request.clienttype = config.get('cashierClientType');
      }

      if (!config.get('sendCashierMessagesToGS')) {
        request.xNoPlayermessageToGs = true;
      }

      if (isNequi) {
        request.specificParams.field3 = '000507';
        request.specificParams.field4 = 'CA';
        request.specificParams.field8 = 'CDC';
      }

      return server.send(request);
    };
  },
);
